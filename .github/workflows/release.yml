name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn sqlmodel sqlalchemy openpyxl playwright pyinstaller
          python -m pip install -r requirements-dev.txt

      - name: Run API tests
        run: python -m pytest

      - name: Build sidecar and bundle Playwright
        shell: cmd
        run: build-sidecar.bat

      - name: Build and upload Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: "Lead Scraper ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}"
          releaseBody: "Instalador recomendado: Lead Scraper x64 setup.exe. O arquivo latest.json é usado pela atualização automática."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: "--config src-tauri/tauri.updater.conf.json"

      - name: Generate checksums
        shell: pwsh
        run: |
          $bundle = "src-tauri\target\release\bundle"
          $files = @(
            Get-ChildItem "$bundle\nsis\*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            Get-ChildItem "$bundle\msi\*.msi" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii "$bundle\SHA256SUMS.txt"

      - name: Upload checksum asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/SHA256SUMS.txt
